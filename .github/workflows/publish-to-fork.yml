name: Publish to fork

# 推送以 v 开头的 tag 时触发（去掉 v 后需与 typst.toml 中的 version 一致）
# 例：git tag v0.4.3 && git push origin v0.4.3
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TOML_VERSION=$(grep -m1 '^version' typst.toml | sed -E 's/version\s*=\s*"([^"]+)".*/\1/')
          echo "Tag: ${TAG}, typst.toml: ${TOML_VERSION}"
          if [ "${TAG}" != "${TOML_VERSION}" ]; then
            echo "::error::Tag (${TAG}) does not match version in typst.toml (${TOML_VERSION})."
            exit 1
          fi
          echo "VERSION=${TAG}" >> "$GITHUB_ENV"

      - name: Sync fork with upstream typst/packages
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: gh repo sync hexiongwu1995/packages --branch main

      # 手动稀疏克隆 fork（方式参考 publish-package-guidance.md）：
      # --depth 1 只取最新提交；--filter="tree:0" 不下载目录树和文件内容，
      # 配合稀疏检出按需下载，避免拉取整个庞大的仓库。
      # 注意：actions/checkout 的 sparse-checkout 只影响工作区检出，
      # 抓取时仍会下载整个 HEAD 快照，因此这里改为手动 git 命令。
      - name: Checkout fork of typst/packages (sparse)
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          git clone --depth 1 --no-checkout --filter="tree:0" \
            "https://x-access-token:${GH_TOKEN}@github.com/hexiongwu1995/packages.git" packages
          cd packages
          git sparse-checkout init
          git sparse-checkout set packages/preview/theoframe/
          git checkout main

      - name: Copy package files into fork
        run: |
          DEST="packages/packages/preview/theoframe/${VERSION}"
          if [ -d "${DEST}" ]; then
            echo "::error::packages/preview/theoframe/${VERSION} already exists in typst/packages."
            exit 1
          fi
          mkdir -p "${DEST}"
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='*.pdf' \
            --exclude='commands.md' \
            --exclude='publish-package-guidance.md' \
            ./ "${DEST}/"

      - name: Commit and push to fork
        working-directory: packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "theoframe-${VERSION}"
          git add "packages/preview/theoframe/${VERSION}"
          git commit -m "theoframe: ${VERSION}"
          git push -u origin "theoframe-${VERSION}"

      # - name: Create pull request to typst/packages
      #   working-directory: packages
      #   env:
      #     GH_TOKEN: ${{ secrets.PACKAGES_PAT }}
      #   run: |
      #     gh pr create \
      #       --repo typst/packages \
      #       --base main \
      #       --head "hexiongwu1995:theoframe-${VERSION}" \
      #       --title "theoframe:${VERSION}" \
      #       --body "$(cat <<'EOF'
      #     I am submitting
      #     - [ ] a new package
      #     - [x] an update for a package

      #     Description: A theorem environment package for Typst.

      #     These are the changes from the previous release: https://github.com/hexiongwu1995/typst-theoframe/releases

      #     <!--
      #     The following are required for a package to be accepted:
      #     - The package name is unique
      #     - The package contains a `typst.toml` file with the `package` table
      #     - The package has an entrypoint and compiles
      #     -->
      #     EOF
      #     )"

  # 在当前仓库创建 GitHub Release（附带自动生成的更新说明）
  release:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "theoframe ${GITHUB_REF_NAME}" \
            --generate-notes
